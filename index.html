<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CO-SHOW 코아이 러너</title>
  <meta name="description" content="CO-SHOW 미니게임 — 코아이와 함께 달리며 컨소시엄을 모아보세요!">
  <!-- 공유(카카오톡 등) 미리보기용 Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="CO-SHOW 코아이 러너">
  <meta property="og:description" content="코아이와 함께 달리며 컨소시엄을 모아보세요!">
  <meta property="og:image" content="https://pokepokemong.github.io/coshow-game/assets/bg/keyvisual_wide.png">
  <meta property="og:url" content="https://pokepokemong.github.io/coshow-game/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/koai.png">
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
  <div id="wrap">
    <h1 class="title">CO-SHOW 코아이 러너 <button id="muteBtn" class="pixel-btn small" style="float:right">🔊</button></h1>

    <div id="gameBox">
      <canvas id="game"></canvas>

      <!-- 시작 화면 -->
      <div id="startScreen" class="overlay">
        <div class="pixel-panel">
          <canvas id="preview"></canvas>
          <p class="big">코아이 러너</p>
          <p class="hint">탭/스페이스로 점프!<br>장애물을 피하고 컨소시엄 심볼을 모으세요<br>(더블점프 가능 · 1000점마다 레벨 UP!)</p>
          <p style="margin:10px 0 6px">
            <input id="nickname" type="text" maxlength="8" placeholder="닉네임 (8자 이내)" autocomplete="off">
          </p>
          <button id="startBtn" class="pixel-btn">게임 시작!</button>
          <p class="hint" id="netState" style="margin-top:8px">연결 확인 중...</p>
        </div>
      </div>

      <!-- 게임오버 화면: 좌(카드+버튼) / 우(랭킹) -->
      <div id="overScreen" class="overlay hidden">
        <div class="over-cols">
          <div class="over-left">
            <canvas id="cardCanvas"></canvas>
            <div class="btn-row">
              <button id="saveBtn" class="pixel-btn alt small">📸 이미지 저장</button>
              <button id="retryBtn" class="pixel-btn small">다시하기</button>
            </div>
          </div>
          <div class="over-right">
            <div id="leaderboard" class="pixel-panel">
              <h3>🏆 TOP 10 <span id="lbMode" class="hint"></span></h3>
              <ol id="lbList"></ol>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      CO-SHOW 체험존 미니게임 · 코아이와 함께 달려요!
    </footer>
  </div>

  <script type="module" src="js/game.js?v=9"></script>
</body>
</html>
